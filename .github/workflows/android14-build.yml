name: Android 14+ Compile

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK (API 34)
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --non-interactive --no-install

      - name: Compile Android release (Android 14+)
        run: |
          cd android
          ./gradlew assembleRelease \
            -Pandroid.compileSdkVersion=35 \
            -Pandroid.targetSdkVersion=35
